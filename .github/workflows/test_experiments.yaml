name: Experiment unit test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run format and lint checks
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Run all units tests
        run: uv run pytest tests
